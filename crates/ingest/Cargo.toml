[package]
name = "memoryos-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Enables tests/integration.rs, which needs Docker with pgvector/pgvector:pg17.
integration = []
# Enables tests/sqlite.rs, which uses local temporary databases and needs no Docker.
integration-sqlite = []

[dependencies]
memoryos-core.workspace = true
memoryos-retrieve.workspace = true
chrono.workspace = true
futures = "0.3"
regex = "1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
memoryos-embed = { workspace = true, features = ["test-embedder"] }
memoryos-store.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
tempfile = "3"
testcontainers = "0.28"
tokio.workspace = true

[lints]
workspace = true
