[package]
name = "memoryos-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Enables tests/, which need Docker with pgvector/pgvector:pg17 and wiremock/wiremock:3.3.1.
integration = []

[dependencies]
memoryos-core.workspace = true
chrono.workspace = true
fastrand = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
memoryos-llm.workspace = true
memoryos-store.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
testcontainers = "0.25"

[lints]
workspace = true
