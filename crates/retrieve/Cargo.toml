[package]
name = "memoryos-retrieve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Enables tests/recall.rs, which needs Docker and the pgvector/pgvector:pg17 image.
integration = []

[dependencies]
memoryos-core.workspace = true
chrono.workspace = true
futures = "0.3"
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
memoryos-embed = { workspace = true, features = ["test-embedder"] }
memoryos-store.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "uuid"] }
testcontainers = "0.28"

[lints]
workspace = true
