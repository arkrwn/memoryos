[package]
name = "memoryos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "memoryos"
path = "src/main.rs"

[features]
# Lets MEMORYOS_TEST_EMBEDDER replace the local model. Test builds only: the Dockerfile's cargo
# commands enable no features, so a release image cannot contain it.
test-embedder = ["memoryos-embed/test-embedder"]
# Enables tests/integration, which needs Docker with pgvector/pgvector:pg17.
integration = ["test-embedder"]
# Enables SQLite process/API tests using local temporary databases.
integration-sqlite = ["test-embedder"]

[dependencies]
memoryos-core.workspace = true
memoryos-store.workspace = true
memoryos-embed = { workspace = true, features = ["local"] }
memoryos-ingest.workspace = true
memoryos-retrieve.workspace = true
memoryos-hooks.workspace = true
axum = "0.8"
base64 = "0.22"
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
prometheus = { version = "0.14", default-features = false }
ratatui = "0.30"
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing.workspace = true
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid.workspace = true

[dev-dependencies]
memoryos-sdk.workspace = true
async-trait.workspace = true
serde_yaml_ng = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tempfile = "3"
testcontainers = "0.28"

[lints]
workspace = true
