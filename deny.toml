# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every entry says why it is accepted. Remove it as soon as the reason stops being true.
ignore = [
    # testcontainers 0.25 requires astral-tokio-tar 0.5. Test-only: it is a dev-dependency, is not
    # in the memoryos binary, and handles archives only from containers the tests start themselves.
    # testcontainers 0.28 moves to astral-tokio-tar 0.6.1, which fixes 0066, 0112 and 0113 but not
    # 0145 (0.6.2 or newer). Upgrading means editing the dev-dependency in each crate.
    { id = "RUSTSEC-2026-0066", reason = "test-only via testcontainers 0.25; not in the shipped binary; fix needs a testcontainers upgrade" },
    { id = "RUSTSEC-2026-0112", reason = "test-only via testcontainers 0.25; not in the shipped binary; fix needs a testcontainers upgrade" },
    { id = "RUSTSEC-2026-0113", reason = "test-only via testcontainers 0.25; not in the shipped binary; fix needs a testcontainers upgrade" },
    { id = "RUSTSEC-2026-0145", reason = "test-only via testcontainers 0.25; not in the shipped binary; fix needs a testcontainers upgrade" },
    # Unmaintained, no patched version. Test-only for the same reason.
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar unmaintained; test-only via testcontainers" },
    # Unmaintained, no patched version. Reached only through bollard, under testcontainers.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; test-only via bollard and testcontainers" },
    # Unmaintained, no patched version. Reached only through serde_yaml_ng, a dev-dependency of the
    # server that parses our own docs/openapi.yaml in a contract test.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; test-only, parses our own OpenAPI file" },
    # Unmaintained, no patched version. In the shipped dependency tree through tokenizers, but
    # paste is a proc macro: it runs at compile time on source code and is not linked or fed input.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; compile-time proc macro under tokenizers, no runtime input" },
]

[licenses]
# Permissive licenses, plus MPL-2.0, whose copyleft covers only modified files of that crate.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Large dependency trees often carry two versions of a crate. Worth a look, not a failure.
multiple-versions = "warn"
# Warn, not deny: workspace crates depend on each other by path, and cargo-deny only excuses path
# dependencies in crates marked `publish = false`, which ours are not yet.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
