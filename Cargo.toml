[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
memoryos-core = { path = "crates/core" }
memoryos-store = { path = "crates/store" }
memoryos-embed = { path = "crates/embed", default-features = false }
memoryos-ingest = { path = "crates/ingest" }
memoryos-retrieve = { path = "crates/retrieve" }
memoryos-sdk = { path = "crates/sdk" }
memoryos-hooks = { path = "crates/hooks" }

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

# SQLx 0.9.0 predates libsqlite3-sys 0.39, whose bundled SQLite fixes CVE-2026-119375.
[patch.crates-io]
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

# Proc macros and build scripts are loaded as dylibs at build time. On macOS 27 a stripped one fails
# to load ("mis-aligned LINKEDIT string pool"), and release builds strip by default.
[profile.release.build-override]
strip = "none"

[profile.dev.build-override]
strip = "none"
