[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"

[workspace.dependencies]
memoryos-core = { path = "crates/core" }
memoryos-store = { path = "crates/store" }
memoryos-llm = { path = "crates/llm" }
memoryos-ingest = { path = "crates/ingest" }
memoryos-retrieve = { path = "crates/retrieve" }
memoryos-agent = { path = "crates/agent" }
memoryos-sdk = { path = "crates/sdk" }
memoryos-hooks = { path = "crates/hooks" }

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
